server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: false

spring:
  application:
    name: api-gateway
  datasource:
    url: jdbc:postgresql://ep-solitary-forest-adhhauxm-pooler.c-2.us-east-1.aws.neon.tech:5432/gateway_db?user=neondb_owner&password=npg_xdHw4FNo1XRC&sslmode=require
    username: neondb_owner
    password: npg_xdHw4FNo1XRC
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/auth/**,/api/keys/**,/api/groups/**, /internal/**, /api/users/**
          filters:
            - PreserveHostHeader

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
