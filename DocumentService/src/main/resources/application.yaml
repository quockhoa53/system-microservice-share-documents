server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
    # Cấu hình để không fail khi de-register không thành công
    should-on-demand-update-status-change: false
    # Tắt health check khi shutdown để tránh lỗi
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: false
    # Lease expiration duration (seconds) - thời gian Eureka chờ trước khi xóa service
    lease-expiration-duration-in-seconds: 30
    # Lease renewal interval (seconds) - tần suất gửi heartbeat
    lease-renewal-interval-in-seconds: 10

spring:
  application:
    name: document-service
  datasource:
    url: jdbc:postgresql://${LOCAL_DB_HOST}:${LOCAL_DB_PORT}/document_db?user=${LOCAL_DB_USERNAME}&password=${LOCAL_DB_PASSWORD}&sslmode=${LOCAL_DB_SSL_MODE}
    username: ${LOCAL_DB_USERNAME}
    password: ${LOCAL_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
          order_inserts: true
          order_updates: true
          jdbc.lob.non_contextual_creation: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: document-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus

minio:
  url: ${MINIO_URL}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET}

keycloak:
  token-base-url: ${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/token
  client-id: ${KEYCLOAK_TOKEN_CLIENT_ID}
  client-secret: ${KEYCLOAK_TOKEN_CLIENT_SECRET}

vault:
  scheme: http
  host: ${VAULT_HOST}
  port: ${VAULT_PORT}
  token: ${VAULT_TOKEN}
  transit-key: ${VAULT_TRANSIT_KEY}

user-key:
  service-name: user-service
  url: lb://user-service
  get-public-key: /api/keys/public-key/get

grant-access:
  service-name: auth-access-control-service
  url: lb://auth-access-control-service
  check-grant-access: /api/document-access/check-access
  create-grant-access: /api/document-access/grant

group:
  service-name: user-service
  url: lb://user-service
  check-membership: /internal/groups/{groupId}/membership?userId={userId}
  get-group-members: /api/groups/{groupId}/members
