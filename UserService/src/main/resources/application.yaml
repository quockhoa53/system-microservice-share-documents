server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
    # Cấu hình để không fail khi de-register không thành công
    should-on-demand-update-status-change: false
    # Tắt health check khi shutdown để tránh lỗi
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: false
    # Lease expiration duration (seconds) - thời gian Eureka chờ trước khi xóa service
    lease-expiration-duration-in-seconds: 30
    # Lease renewal interval (seconds) - tần suất gửi heartbeat
    lease-renewal-interval-in-seconds: 10

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://${LOCAL_DB_HOST}:${LOCAL_DB_PORT}/user_db?user=${LOCAL_DB_USERNAME}&password=${LOCAL_DB_PASSWORD}&sslmode=${LOCAL_DB_SSL_MODE}
    username: ${LOCAL_DB_USERNAME}
    password: ${LOCAL_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

app:
  security:
    keycloak:
      resource-client-id: ${KEYCLOAK_CLIENT_ID}
      server-url: ${KEYCLOAK_URL:http://localhost:9090}
      # Realm để quản lý groups (nên dùng system-share-docs để nhất quán với authentication)
      realm: ${KEYCLOAK_REALM:system-share-docs}
      # Realm để login admin (thường là master - realm quản lý của Keycloak)
      admin-realm: ${KEYCLOAK_ADMIN_REALM:master}
      admin-username: ${KEYCLOAK_ADMIN:admin}
      admin-password: ${KEYCLOAK_ADMIN_PASSWORD:admin}
      client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}

vault:
  scheme: http
  host: ${VAULT_HOST}
  port: ${VAULT_PORT}
  token: ${VAULT_TOKEN}
  transit-key: ${VAULT_TRANSIT_KEY}

minio:
  url: ${MINIO_URL}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET}