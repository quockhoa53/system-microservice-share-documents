plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.system_share_documents'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	// Security cho JWT
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.security:spring-security-oauth2-resource-server:6.2.1'
	implementation 'org.springframework.security:spring-security-oauth2-jose:6.2.1'
	// Actuator cho giám sát
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	// JPA và PostgreSQL cho log
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'org.postgresql:postgresql'
	// Lombok
	implementation 'org.projectlombok:lombok:1.18.34'
	annotationProcessor 'org.projectlombok:lombok:1.18.34'
	//Eureka
	implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
	implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'
	// Config Client
	implementation 'org.springframework.cloud:spring-cloud-starter-config'
	implementation('org.springframework.cloud:spring-cloud-starter-bootstrap')
	// spring-dotenv (nạp .env)
	implementation "me.paulschwarz:spring-dotenv:3.0.0"
	// PDF
	implementation 'org.apache.pdfbox:pdfbox:2.0.30'
	// Apache POI for Office files (Word, Excel, PowerPoint)
	implementation 'org.apache.poi:poi:5.2.5'
	implementation 'org.apache.poi:poi-ooxml:5.2.5'
	implementation 'org.apache.poi:poi-scratchpad:5.2.5'
	// kafka
	implementation 'org.apache.kafka:kafka-clients:3.8.0'
	implementation 'org.springframework.kafka:spring-kafka:3.2.2'
	// Resilience4j
	implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.2.0'
	// Redis
	implementation 'com.redislabs:jredisearch:2.2.0'
	implementation 'redis.clients:jedis:3.7.1'
	// GELF Appender for Graylog
	implementation 'de.siegmar:logback-gelf:5.0.0'
	// Janino for logback conditional processing
	implementation 'org.codehaus.janino:janino:3.1.12'
	// Testing
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	//Source common
	implementation project(':AppCommonService')
}

dependencyManagement {
	imports {
		mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2023.0.1'
	}
}

tasks.named('test') {
	useJUnitPlatform()
}