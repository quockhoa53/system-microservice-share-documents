services:
  # Keycloak (OIDC)
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.2
    command: start-dev --http-port=9090 --spi-login-protocol-openid-connect-legacy-logout-redirect-uri=true
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "9090:9090"
    networks:
      - system-net

  # MinIO (S3 storage)
  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # API (S3)
      - "9001:9001"   # Web UI
    volumes:
      - minio_data:/data
    networks:
      - system-net

  # Vault (Secret Manager)
  vault:
    image: hashicorp/vault:1.13
    container_name: vault
    ports:
      - "8200:8200"
    volumes:
      - ./vault/data:/vault/data
      - ./vault/config.hcl:/vault/config.hcl
      - ./vault/policies:/vault/policies   # <-- ADD THIS
    cap_add:
      - IPC_LOCK
    command: vault server -config=/vault/config.hcl
    networks:
      - system-net

  # Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - app-net

  kafka:
    image: confluentinc/cp-kafka:7.2.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_HOST://kafka:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - app-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: system-share-document-kafka-ui
    ports:
      - "9080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092
      - KAFKA_CLUSTERS_0_ZOOKEEPER=zookeeper:2181
    depends_on:
      - kafka
      - zookeeper
    networks:
      - app-net

  # Kafka Connect (Debezium)
  kafka-connect:
    image: debezium/connect:2.3
    container_name: kafka-connect
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      # replication factor cho topic internal
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
    ports:
      - "8090:8083"  # host 8090 → container 8083
    depends_on:
      - kafka
    networks:
      - app-net

  flink-jobmanager:
    build:
      context: .
      dockerfile: Dockerfile.flink-java17
    image: flink-jobmanager-custom
    container_name: flink-jobmanager
    ports:
      - "8181:8081"
      - "6123:6123"
    command: jobmanager
    volumes:
      - ../jars:/jars
      - ./flink-conf.yaml:/opt/flink/conf/flink-conf.yaml
    networks:
      - app-net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081" ]
      interval: 10s
      timeout: 5s
      retries: 5

  flink-taskmanager:
    build:
      context: .
      dockerfile: Dockerfile.flink-java17
    image: flink-taskmanager-custom
    container_name: flink-taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    command: taskmanager
    volumes:
      - ../jars:/jars
      - ./flink-conf.yaml:/opt/flink/conf/flink-conf.yaml
    networks:
      - app-net

  # Redis
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    command: [ "redis-server", "--appendonly", "yes" ]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch-oss:7.10.2
    container_name: elasticsearch
    environment:
      - http.host=0.0.0.0
      - transport.host=127.0.0.1
      - network.host=0.0.0.0
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    mem_limit: 2g
    networks:
      - app-net

networks:
  system-net:
    driver: bridge
  app-net:
    driver: bridge

volumes:
  minio_data:
